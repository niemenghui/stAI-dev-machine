version: "3.8"

services:
  mongo:
    image: niemenghui/nq-mongo:${DOCKER_TAG}
    env_file:
      - nq-express/.env.prd
    environment:
      MDB_HOST_FILE: /run/secrets/MDB_HOST
      MDB_PROTOCOL_FILE: /run/secrets/MDB_PROTOCOL
      MDB_PORT_FILE: /run/secrets/MDB_PORT
      MDB_DATABASE_FILE: /run/secrets/MDB_DATABASE
      MDB_USERNAME_FILE: /run/secrets/MDB_USERNAME
      MDB_PASSWORD_FILE: /run/secrets/MDB_PASSWORD
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_vol:/data/db
    networks:
      - net-nq
    secrets:
      - MDB_HOST
      - MDB_PROTOCOL
      - MDB_PORT
      - MDB_DATABASE
      - MDB_USERNAME
      - MDB_PASSWORD
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  express:
    image: niemenghui/nq-express:${DOCKER_TAG}
    env_file:
      - nq-express/.env.prd
    environment:      
      MDB_HOST_FILE: /run/secrets/MDB_HOST
      MDB_PROTOCOL_FILE: /run/secrets/MDB_PROTOCOL
      MDB_PORT_FILE: /run/secrets/MDB_PORT         
      MDB_DATABASE_FILE: /run/secrets/MDB_DATABASE
      MDB_USERNAME_FILE: /run/secrets/MDB_USERNAME
      MDB_PASSWORD_FILE: /run/secrets/MDB_PASSWORD   
    ports:
      - "${EXPRESS_PORT}:5000"
    depends_on:
      - mongo
    networks:
      - net-nq    
    secrets:
      - MDB_HOST
      - MDB_PROTOCOL
      - MDB_PORT
      - MDB_DATABASE
      - MDB_USERNAME
      - MDB_PASSWORD    
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  next:
    image: niemenghui/nq-next:${DOCKER_TAG}
    env_file:
      - nq-next/.env.production
    ports:
      - "${NEXT_PORT}:3000"
    networks:
      - net-nq
    depends_on:
      - express
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

