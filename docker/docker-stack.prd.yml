  storybook:
    image: niemenghui/nq-storybook:${DOCKER_TAG}
    ports:
      - "${STORYBOOK_PORT}:80"        # Storybook runs on port 80 inside container 
    volumes: 
      - caddy_data:/data    # REQUIRED for Caddy internal TLS   
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M

networks:
  net-nq:
    name: net-nq

secrets:
  MDB_HOST:
    external: true
  MDB_PROTOCOL:
    external: true 
  MDB_PORT:
    external: true 
  MDB_DATABASE:
    external: true
  MDB_USERNAME:
    external: true
  MDB_PASSWORD:
    external: true

volumes:
  mongo_vol:
  weaviate_vol:
  models_vol:
  caddy_data:     # persistent storage for Caddy certificates. Not using now, for future try.
